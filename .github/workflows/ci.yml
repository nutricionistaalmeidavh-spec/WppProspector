name: Monorepo CI

# CI obrigatório em alterações de código e PRs; sem publicação automática.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify shared contracts are synchronized
        run: npm run check:contracts

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:smoke

      - name: Testar exportação comercial isolada
        run: node --test scripts/export-commercial.test.mjs

      - name: Gerar ZIP comercial e testar instalação sem histórico Git
        shell: bash
        run: |
          node scripts/export-commercial.mjs --out "$RUNNER_TEMP/wppprospector-comercial.zip"
          mkdir -p "$RUNNER_TEMP/commercial-qa"
          unzip -q "$RUNNER_TEMP/wppprospector-comercial.zip" -d "$RUNNER_TEMP/commercial-qa"
          test ! -d "$RUNNER_TEMP/commercial-qa/.git"
          test ! -e "$RUNNER_TEMP/commercial-qa/.env"
          test ! -d "$RUNNER_TEMP/commercial-qa/apps/server/data"
          cd "$RUNNER_TEMP/commercial-qa"
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm run test:smoke
