name: Monorepo CI

# Execução manual: a instalação e os testes também rodam pelo terminal.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify shared contracts are synchronized
        run: npm run check:contracts

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
