name: QA — painel real e capturas Playwright

on:
  pull_request:
    branches:
      - main
      - feat/crm-commercial-pack-20261111
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/qa-visual.yml'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-visual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-qa:
    name: Testes + telas reais (desktop e mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      # Capturar e validar o SHA exato da branch de QA; o alvo do PR continua
      # recebendo commits paralelos e seu merge temporario nem sempre compila.
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências do projeto
        run: npm ci

      - name: QA de contratos, lint, tipos, testes e build
        id: checks
        continue-on-error: true
        run: npm run check

      - name: Compilar para captura mesmo se testes unitários falharem
        run: npm run build

      - name: Smoke do servidor real com SQLite temporário
        id: smoke
        continue-on-error: true
        run: npm run test:smoke

      - name: Instalar Playwright open source em pasta isolada
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/wpp-qa-tools"
          npm install --prefix "$RUNNER_TEMP/wpp-qa-tools" --no-save --package-lock=false playwright@1.56.1
          node "$RUNNER_TEMP/wpp-qa-tools/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Navegar pelas telas reais e capturar PNGs
        id: screenshots
        continue-on-error: true
        env:
          QA_PLAYWRIGHT_MODULE: ${{ runner.temp }}/wpp-qa-tools/node_modules/playwright/index.mjs
        run: node scripts/qa-visual.mjs

      - name: Publicar imagens reais e relatório como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpp-prospector-qa-telas-${{ github.run_number }}
          path: artifacts/qa-visual/
          if-no-files-found: warn
          retention-days: 14

      - name: Reprovar QA quando testes, smoke ou capturas falharem
        if: always() && (steps.checks.outcome == 'failure' || steps.smoke.outcome == 'failure' || steps.screenshots.outcome == 'failure')
        run: |
          echo 'A QA identificou falhas. Consulte os logs e baixe o artifact de screenshots para diagnosticar.'
          exit 1
